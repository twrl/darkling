<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Darkling</title>
    <link rel="stylesheet" href="./src/index.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!--
      The service-bus and state-manager hosts wrap <darkling-app> so the app
      and the UI components consume the ServiceClient and the shared-state
      LocalCopy from ancestor providers (Lit context flows downward). The
      hosts' options are set imperatively by main.ts.
    -->
    <service-bus-host>
      <state-manager-host>
        <darkling-app></darkling-app>
      </state-manager-host>
    </service-bus-host>
  </body>
</html>
